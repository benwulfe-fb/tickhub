# TickHub Golden Replay Test Configuration
shm:
  name: "tickhub_golden_test"
  max_frames: 128
  cadence_interval: 1000000000  # 1 second in nanoseconds

features:
  - "log_ret_1s"
  - "log_ret_5s"
  - "log_ret_15s"
  - "vol_1s"
  - "spread_bps"

unique_symbols:
  - "DASH"

phases:
  - id: 0
    name: "phase_0ms"
    offset_ms: 0
    symbols:
      - "DASH"
